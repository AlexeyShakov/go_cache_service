services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  seed:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      SEED_DATASET_PATH: /app/testdata/seed.json
    volumes:
      - ./internal/testdata:/app/testdata:ro
    depends_on:
      redis:
        condition: service_healthy
    entrypoint: ["/app/seed"]
    restart: "no"

volumes:
  redis_data: